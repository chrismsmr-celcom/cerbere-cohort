name: CI

on:
  push:
    branches: [main, feat/production-supabase-render]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,postgres]"
      - name: Import HTTP API adapter
        run: python -c "from cerbere_cohort.api import app; assert app"
      - name: Test
        run: pytest

  postgres-integration:
    name: PostgreSQL migrations and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cohort_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cohort_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COHORT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cohort_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e "./python[dev,postgres]"
      - name: Apply every Supabase migration and test tenant isolation
        run: python -m pytest python/tests/test_postgres_live_integration.py python/tests/test_postgres_task_coordination.py -q

  rust:
    name: Rust trace analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Run on the example trace
        run: cargo run -p cerbere-cohort-trace -- example-trace.jsonl

  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install library and MCP server
        run: python -m pip install -e './python[postgres]' -e ./integrations/mcp-server pytest
      - name: Test MCP service
        run: python -m pytest integrations/mcp-server/tests

  web:
    name: React dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
