services:
  - type: web
    name: cohort-api
    runtime: python
    # Free suspends when idle; the dashboard waits up to 90s for cold starts.
    # Keep one instance and one Uvicorn worker until runtime state is shared.
    plan: free
    rootDir: python
    buildCommand: pip install ".[postgres]"
    startCommand: uvicorn cerbere_cohort.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COHORT_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: COHORT_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: COHORT_REQUIRE_LEASES
        value: "false"
